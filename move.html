<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초코땡 이사 준비</title>
  
  <meta property="og:title" content="초코땡 이사 준비">
  <meta property="og:description" content="우리 부부만의 스마트 이사 체크리스트">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .active-scale:active { transform: scale(0.95); }
    .modal-enter { animation: modalFadeIn 0.2s ease-out forwards; }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen">
  
  <!-- 커스텀 모달 (브라우저 alert 대체) -->
  <div id="custom-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="window.closeCustomModal()"></div>
    <div class="bg-white rounded-3xl w-full max-w-xs p-6 relative z-10 modal-enter border shadow-2xl text-center">
      <div id="modal-icon" class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h3 id="modal-msg-title" class="text-base font-bold text-slate-800 mb-1">알림</h3>
      <p id="modal-msg-body" class="text-xs text-slate-500 mb-5 leading-relaxed"></p>
      <div id="modal-buttons" class="flex gap-2">
        <button onclick="window.closeCustomModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold transition-colors">확인</button>
      </div>
    </div>
  </div>

  <!-- 앱 전체 래퍼 -->
  <div class="w-full max-w-md sm:max-w-4xl bg-white min-h-screen sm:my-8 sm:rounded-[2.5rem] sm:shadow-2xl sm:border border-slate-200 relative flex flex-col overflow-hidden">
    
    <!-- 상단 헤더 -->
    <header class="pt-6 pb-4 px-5 flex items-center justify-between border-b border-slate-100 bg-white/80 backdrop-blur-md sticky top-0 z-30">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-emerald-600 text-white flex items-center justify-center shadow-md shadow-emerald-100">
          <i class="fa-solid fa-truck-moving text-sm"></i>
        </div>
        <div>
          <h1 class="text-lg font-extrabold text-slate-900 tracking-tight">초코땡 이사 준비</h1>
          <p class="text-[11px] font-medium text-slate-400">현식 ❤️ 초록 부부 통합 체크리스트</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="sync-status" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" title="실시간 동기화 중"></span>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 (데스크탑 및 모바일 2분할 균형 배치) -->
    <section class="flex-grow grid grid-cols-2 gap-3 sm:gap-5 p-3 sm:p-5 bg-slate-50/50 overflow-y-auto no-scrollbar pb-24">
      
      <!-- 현식's 컬럼 -->
      <div id="col-현식" class="col-card bg-white rounded-3xl p-3 sm:p-4 border border-slate-200/80 shadow-sm flex flex-col">
        <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-100">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm shadow-blue-200"></span>
            <h2 class="text-xs sm:text-sm font-extrabold text-slate-800">현식's 할 일</h2>
          </div>
          <span id="count-현식" class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 text-[10px] sm:text-[11px] font-bold">0개</span>
        </div>
        <div id="list-현식" class="flex-grow space-y-2 min-h-[160px]"></div>
        <button onclick="window.openTaskModal('현식')" class="mt-3 w-full py-2 border border-dashed border-slate-200 hover:border-blue-300 hover:bg-blue-50/50 text-slate-500 hover:text-blue-600 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-plus text-[9px]"></i> 할 일 추가
        </button>
      </div>

      <!-- 초록's 컬럼 (올초록 테마) -->
      <div id="col-초록" class="col-card bg-white rounded-3xl p-3 sm:p-4 border border-slate-200/80 shadow-sm flex flex-col">
        <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-100">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-200"></span>
            <h2 class="text-xs sm:text-sm font-extrabold text-slate-800">초록's 할 일</h2>
          </div>
          <span id="count-초록" class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 text-[10px] sm:text-[11px] font-bold">0개</span>
        </div>
        <div id="list-초록" class="flex-grow space-y-2 min-h-[160px]"></div>
        <button onclick="window.openTaskModal('초록')" class="mt-3 w-full py-2 border border-dashed border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/50 text-slate-500 hover:text-emerald-600 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1">
          <i class="fa-solid fa-plus text-[9px]"></i> 할 일 추가
        </button>
      </div>

    </section>

    <!-- 우측 하단 빠른 추가 버튼 -->
    <button onclick="window.openTaskModal('초록')" class="absolute bottom-6 right-6 w-14 h-14 bg-emerald-600 text-white rounded-full shadow-lg shadow-emerald-200 flex items-center justify-center active-scale transition-transform text-xl z-20 hover:bg-emerald-700">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- 할 일 추가/수정 모달 -->
  <div id="task-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="window.closeTaskModal()"></div>
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 relative z-10 modal-enter border shadow-xl">
      <h3 id="modal-title" class="text-base font-bold mb-4 text-slate-800">할 일 추가</h3>
      <input type="hidden" id="edit-id">
      
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">담당자</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="window.selectAssignee('현식')" id="btn-assign-현식" class="py-2.5 rounded-xl border border-slate-200 text-xs font-bold transition-all text-slate-600">현식</button>
            <button type="button" onclick="window.selectAssignee('초록')" id="btn-assign-초록" class="py-2.5 rounded-xl border border-slate-200 text-xs font-bold transition-all text-slate-600">초록</button>
          </div>
          <input type="hidden" id="input-assignee" value="초록">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">할 일 내용</label>
          <input type="text" id="input-title" placeholder="예: 이사 업체 계약 확인" class="w-full bg-slate-50 rounded-xl px-4 py-3 border border-slate-200 outline-none focus:border-emerald-400 focus:bg-white transition-colors text-xs text-slate-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">목표 날짜 (선택)</label>
          <input type="date" id="input-date" class="w-full bg-slate-50 rounded-xl px-3 py-3 border border-slate-200 outline-none focus:border-emerald-400 focus:bg-white transition-colors text-xs text-slate-700">
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="window.closeTaskModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition-colors">취소</button>
        <button onclick="window.saveTask()" id="btn-save" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-xs font-bold shadow-md shadow-emerald-200 transition-colors">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Firebase 및 애플리케이션 로직 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = JSON.parse('{"apiKey": "AIzaSyBnjCWfcbvrvadmQ3bjoRJTD-rXSKzp_Bo", "authDomain": "git-io-33713.firebaseapp.com", "projectId": "git-io-33713", "storageBucket": "git-io-33713.firebasestorage.app", "messagingSenderId": "488733080531", "appId": "1:488733080531:web:2a95f7c25856b078ce8d26"}');
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allTasks = [];
    let draggedId = null;

    signInAnonymously(auth).catch(err => console.error("Auth error:", err));
    onAuthStateChanged(auth, (user) => {
      if (user) {
        setupFirestoreListener();
      }
    });

    function setupFirestoreListener() {
      // 최상단 'move' 컬렉션 참조
      const colRef = collection(db, 'move');
      onSnapshot(colRef, (snapshot) => {
        allTasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        allTasks.sort((a, b) => (a.order || 0) - (b.order || 0));
        render();
      }, (error) => {
        console.error("Firestore sync error:", error);
      });
    }

    window.selectAssignee = (name) => {
      document.getElementById('input-assignee').value = name;
      const isH = name === '현식';
      const isC = name === '초록';

      document.getElementById('btn-assign-현식').className = `py-2.5 rounded-xl border text-xs font-bold transition-all ${isH ? 'bg-blue-500 border-blue-500 text-white shadow-md shadow-blue-100' : 'border-slate-200 text-slate-600'}`;
      document.getElementById('btn-assign-초록').className = `py-2.5 rounded-xl border text-xs font-bold transition-all ${isC ? 'bg-emerald-500 border-emerald-500 text-white shadow-md shadow-emerald-100' : 'border-slate-200 text-slate-600'}`;
    };

    function render() {
      renderColumn('현식', 'list-현식', 'count-현식');
      renderColumn('초록', 'list-초록', 'count-초록');
    }

    function renderColumn(assigneeName, containerId, countId) {
      const tasks = allTasks.filter(t => t.assignee === assigneeName);
      
      tasks.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.order || 0) - (b.order || 0);
      });

      document.getElementById(countId).innerText = `${tasks.length}개`;

      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-regular fa-clipboard text-xl mb-1.5 opacity-60"></i>
            <p class="text-[10px] sm:text-[11px]">등록된 할 일이 없습니다.</p>
          </div>
        `;
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      tasks.forEach((task) => {
        const item = document.createElement('div');
        item.className = `group flex items-center justify-between p-2.5 rounded-2xl border transition-all bg-white shadow-sm ${task.completed ? 'opacity-50 bg-slate-50 border-slate-100' : 'border-slate-200/80 hover:border-emerald-200'}`;
        item.draggable = !task.completed;
        item.dataset.id = task.id;

        let dateBadgeHtml = '';
        if (task.date) {
          const taskDate = new Date(task.date);
          taskDate.setHours(0,0,0,0);
          const diffTime = taskDate - today;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

          let badgeColor = 'bg-slate-100 text-slate-600 border-slate-200';
          let badgeText = task.date;

          if (diffDays < 0) {
            badgeColor = 'bg-slate-100 text-slate-400 border-slate-200 line-through';
            badgeText = `D+${Math.abs(diffDays)}`;
          } else if (diffDays === 0) {
            badgeColor = 'bg-rose-500 text-white border-rose-600 shadow-sm shadow-rose-200 animate-pulse font-bold';
            badgeText = '오늘 D-Day!';
          } else if (diffDays <= 3) {
            badgeColor = 'bg-rose-50 text-rose-600 border-rose-200 font-bold';
            badgeText = `D-${diffDays}`;
          } else if (diffDays <= 7) {
            badgeColor = 'bg-amber-50 text-amber-600 border-amber-200';
            badgeText = `D-${diffDays}`;
          } else {
            badgeColor = 'bg-emerald-50/70 text-emerald-600 border-emerald-100';
            badgeText = task.date;
          }

          dateBadgeHtml = `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[9px] border ${badgeColor}"><i class="fa-regular fa-calendar-days text-[8px]"></i> ${badgeText}</span>`;
        } else {
          dateBadgeHtml = `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[9px] bg-slate-50 text-slate-400 border border-slate-100">날짜 미지정</span>`;
        }

        item.innerHTML = `
          <div class="flex items-center gap-1.5 flex-grow min-w-0">
            <div class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500 transition-colors" title="순서 변경">
              <i class="fa-solid fa-grip-vertical text-[9px]"></i>
            </div>
            <button onclick="window.toggleComplete('${task.id}', ${!task.completed})" class="w-5 h-5 rounded-md border flex items-center justify-center transition-all flex-shrink-0 ${task.completed ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 hover:border-emerald-400 bg-white'}">
              ${task.completed ? '<i class="fa-solid fa-check text-[9px]"></i>' : ''}
            </button>
            <div class="min-w-0 flex-grow">
              <p class="text-[11px] font-bold truncate ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${task.title}</p>
              <div class="flex items-center gap-1 mt-0.5">
                ${dateBadgeHtml}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-0.5 ml-1 flex-shrink-0 opacity-80 group-hover:opacity-100 transition-opacity">
            <button onclick="window.openTaskModal(null, '${task.id}')" class="w-5 h-5 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-emerald-600 hover:border-emerald-200 flex items-center justify-center transition-all"><i class="fa-solid fa-pen text-[7px]"></i></button>
            <button onclick="window.deleteTask('${task.id}')" class="w-5 h-5 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-rose-500 hover:border-rose-200 flex items-center justify-center transition-all"><i class="fa-solid fa-trash text-[7px]"></i></button>
          </div>
        `;

        item.addEventListener('dragstart', (e) => {
          draggedId = task.id;
          item.classList.add('opacity-40');
        });
        item.addEventListener('dragend', (e) => {
          draggedId = null;
          item.classList.remove('opacity-40');
        });
        item.addEventListener('dragover', (e) => {
          e.preventDefault();
        });
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          if (!draggedId || draggedId === task.id) return;
          reorderTasks(draggedId, task.id, assigneeName);
        });

        container.appendChild(item);
      });
    }

    window.openTaskModal = (defaultAssignee = '초록', id = null) => {
      document.getElementById('edit-id').value = id || '';
      if (id) {
        const task = allTasks.find(t => t.id === id);
        if (!task) return;
        document.getElementById('modal-title').innerText = "할 일 수정";
        window.selectAssignee(task.assignee || defaultAssignee);
        document.getElementById('input-title').value = task.title || '';
        document.getElementById('input-date').value = task.date || '';
      } else {
        document.getElementById('modal-title').innerText = "할 일 추가";
        window.selectAssignee(defaultAssignee);
        document.getElementById('input-title').value = '';
        document.getElementById('input-date').value = '';
      }
      document.getElementById('task-modal').classList.remove('hidden');
    };

    window.closeTaskModal = () => {
      document.getElementById('task-modal').classList.add('hidden');
    };

    window.saveTask = async () => {
      const id = document.getElementById('edit-id').value;
      const assignee = document.getElementById('input-assignee').value;
      const title = document.getElementById('input-title').value.trim();
      const date = document.getElementById('input-date').value;

      if (!title) {
        showCustomModal("입력 오류", "할 일 내용을 입력해주세요.");
        return;
      }

      try {
        const colRef = collection(db, 'move');
        if (id) {
          await updateDoc(doc(db, 'move', id), {
            assignee, title, date
          });
        } else {
          const assigneeTasks = allTasks.filter(t => t.assignee === assignee);
          const maxOrder = assigneeTasks.length > 0 ? Math.max(...assigneeTasks.map(t => t.order || 0)) : 0;
          await addDoc(colRef, {
            assignee,
            title,
            date,
            completed: false,
            order: maxOrder + 1,
            createdAt: Date.now()
          });
        }
        window.closeTaskModal();
      } catch (e) {
        console.error("Save error:", e);
        showCustomModal("저장 실패", "데이터 저장 중 오류가 발생했습니다.");
      }
    };

    window.toggleComplete = async (id, status) => {
      try {
        await updateDoc(doc(db, 'move', id), {
          completed: status
        });
      } catch (e) {
        console.error("Toggle error:", e);
      }
    };

    window.deleteTask = async (id) => {
      try {
        await deleteDoc(doc(db, 'move', id));
      } catch (e) {
        console.error("Delete error:", e);
      }
    };

    async function reorderTasks(fromId, toId, assigneeName) {
      const assigneeTasks = allTasks.filter(t => t.assignee === assigneeName);
      const fromIdx = assigneeTasks.findIndex(t => t.id === fromId);
      const toIdx = assigneeTasks.findIndex(t => t.id === toId);
      if (fromIdx < 0 || toIdx < 0) return;

      const [moved] = assigneeTasks.splice(fromIdx, 1);
      assigneeTasks.splice(toIdx, 0, moved);

      try {
        for (let i = 0; i < assigneeTasks.length; i++) {
          const t = assigneeTasks[i];
          if (t.order !== i) {
            await updateDoc(doc(db, 'move', t.id), {
              order: i
            });
          }
        }
      } catch (e) {
        console.error("Reorder error:", e);
      }
    }

    function showCustomModal(title, body) {
      document.getElementById('modal-msg-title').innerText = title;
      document.getElementById('modal-msg-body').innerText = body;
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    window.closeCustomModal = () => {
      document.getElementById('custom-modal').classList.add('hidden');
    };
  </script>
</body>
</html>
