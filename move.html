<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연두네 이사 일정 & 예산 플래너</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .modal-enter { animation: modalFadeIn 0.2s ease-out forwards; }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen p-0 sm:p-6">

  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[850px] sm:rounded-[2.5rem] sm:shadow-2xl sm:border border-slate-200/80 relative flex flex-col overflow-hidden">
    
    <header class="pt-6 pb-4 px-5 flex items-center justify-between border-b border-slate-100 flex-shrink-0 bg-white z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-rose-500 flex items-center justify-center text-white shadow-md shadow-indigo-100">
          <i class="fa-solid fa-house-chimney text-base"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold text-slate-900 leading-tight">연두네 이사 플래너</h1>
          <p id="dday-display" class="text-[11px] font-bold text-rose-500 mt-0.5">이사 D-DAY 계산 중...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.openScheduleModal()" class="px-3 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-extrabold transition-colors flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-plus"></i> 일정·요금 추가
        </button>
      </div>
    </header>

    <section class="flex-grow flex flex-col p-4 gap-4 overflow-y-auto bg-slate-50/60">
      
      <!-- 총 예산 요약 카드 -->
      <div class="bg-gradient-to-r from-slate-900 to-slate-800 rounded-3xl p-5 text-white shadow-lg flex-shrink-0 flex items-center justify-between">
        <div>
          <p class="text-[11px] font-medium text-slate-400">총 예상 이사 비용</p>
          <h2 id="total-cost-display" class="text-xl font-extrabold mt-1 text-rose-400">0 원</h2>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-rose-400 text-lg shadow-inner">
          <i class="fa-solid fa-wallet"></i>
        </div>
      </div>

      <!-- 이사 달력 미리보기 위젯 -->
      <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm flex-shrink-0">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-indigo-500 shadow-sm shadow-indigo-200"></span>
            <h3 class="text-xs font-extrabold text-slate-800">10월 7일 이사 달력 & 일정</h3>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="window.changeCalendarMonth(-1)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-[10px]">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="calendar-month-title" class="text-[11px] font-bold text-slate-700 px-1">2026. 10</span>
            <button onclick="window.changeCalendarMonth(1)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-[10px]">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <!-- 요일 헤더 -->
        <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 mb-1.5">
          <div class="text-rose-500">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-indigo-500">토</div>
        </div>

        <!-- 달력 그리드 -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- 등록된 일정 및 요금 리스트 -->
      <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm flex flex-col flex-grow">
        <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-100 flex-shrink-0">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 shadow-sm shadow-rose-200"></span>
            <h3 class="text-xs font-extrabold text-slate-800">이사 일정 및 비용 내역</h3>
          </div>
          <span id="schedule-count" class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 text-[10px] font-bold">0건</span>
        </div>
        <div id="schedule-list" class="space-y-2.5 overflow-y-auto custom-scrollbar flex-grow pr-1 max-h-[300px]"></div>
      </div>

    </section>

  </div>

  <div id="schedule-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="window.closeScheduleModal()"></div>
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 relative z-10 modal-enter border shadow-xl">
      <h3 id="modal-title" class="text-base font-extrabold mb-4 text-slate-800">이사 일정 및 요금 추가</h3>
      <input type="hidden" id="edit-id">
      
      <div class="space-y-3.5 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">일정 내용</label>
          <input type="text" id="input-title" placeholder="예: 포장이사 계약금 입금" class="w-full bg-slate-50 rounded-xl px-4 py-3 border border-slate-200 outline-none focus:border-indigo-400 focus:bg-white transition-colors text-sm text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">예정 일자</label>
          <input type="date" id="input-date" class="w-full bg-slate-50 rounded-xl px-3 py-3 border border-slate-200 outline-none focus:border-indigo-400 focus:bg-white transition-colors text-sm text-slate-700">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">금액 / 요금 (원)</label>
          <input type="number" id="input-cost" placeholder="예: 1500000" class="w-full bg-slate-50 rounded-xl px-4 py-3 border border-slate-200 outline-none focus:border-indigo-400 focus:bg-white transition-colors text-sm text-slate-800">
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="window.closeScheduleModal()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold transition-colors">취소</button>
        <button onclick="window.saveSchedule()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl text-xs font-bold shadow-md transition-colors">확인</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'yondu-moving-planner-v1';
    const firebaseConfig = JSON.parse('{"apiKey": "AIzaSyBnjCWfcbvrvadmQ3bjoRJTD-rXSKzp_Bo", "authDomain": "git-io-33713.firebaseapp.com", "projectId": "git-io-33713", "storageBucket": "git-io-33713.firebasestorage.app", "messagingSenderId": "488733080531", "appId": "1:488733080531:web:2a95f7c25856b078ce8d26"}');
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let schedules = [];
    let calendarDate = new Date(2026, 9, 1); // 2026년 10월 기준 기본 세팅

    // D-Day 계산 (10월 7일 기준)
    function updateDday() {
      const today = new Date();
      const currentYear = today.getFullYear();
      let movingDate = new Date(currentYear, 9, 7); // 10월 7일
      
      const diffTime = movingDate - new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const ddayEl = document.getElementById('dday-display');
      if (ddayEl) {
        if (diffDays > 0) {
          ddayEl.innerText = `이사 D-${diffDays} (10월 7일)`;
        } else if (diffDays === 0) {
          ddayEl.innerText = `드디어 오늘이 이사일입니다! 🎉`;
        } else {
          ddayEl.innerText = `이사 완료 D+${Math.abs(diffDays)}`;
        }
      }
    }
    updateDday();

    signInAnonymously(auth);
    onAuthStateChanged(auth, (user) => {
      if (user) {
        setupListener();
      }
    });

    function setupListener() {
      onSnapshot(collection(db, 'yondu_moving_schedules'), (snapshot) => {
        schedules = snapshot.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));
        renderAll();
      }, (error) => {
        console.error("Firestore Error:", error);
      });
    }

    function formatNumber(num) {
      if (!num) return '0';
      return Number(num).toLocaleString('ko-KR');
    }

    function renderAll() {
      renderSchedulesList();
      renderCalendar();
      updateTotalCost();
    }

    function updateTotalCost() {
      const total = schedules.reduce((acc, curr) => acc + (Number(curr.cost) || 0), 0);
      document.getElementById('total-cost-display').innerText = `${formatNumber(total)} 원`;
    }

    function renderSchedulesList() {
      schedules.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      const countEl = document.getElementById('schedule-count');
      if (countEl) countEl.innerText = `${schedules.length}건`;

      const container = document.getElementById('schedule-list');
      if (!container) return;
      container.innerHTML = '';

      if (schedules.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-regular fa-calendar-xmark text-2xl mb-1.5 opacity-60"></i>
            <p class="text-xs">등록된 일정이나 요금이 없습니다.</p>
          </div>
        `;
        return;
      }

      schedules.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = "flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100 hover:border-slate-200 transition-all";

        const costText = item.cost && Number(item.cost) > 0 ? `<span class="text-xs font-extrabold text-rose-600">${formatNumber(item.cost)} 원</span>` : '<span class="text-[10px] text-slate-400">비용 없음</span>';
        const dateText = item.date ? `<span class="text-[10px] bg-indigo-50 text-indigo-600 font-bold px-2 py-0.5 rounded-md">${item.date}</span>` : '<span class="text-[10px] text-slate-400">날짜 미지정</span>';

        itemEl.innerHTML = `
          <div class="overflow-hidden pr-2">
            <p class="text-xs font-bold text-slate-800 truncate">${item.title}</p>
            <div class="flex items-center gap-1.5 mt-1">
              ${dateText}
              ${costText}
            </div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="window.editSchedule('${item.id}')" class="w-7 h-7 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-indigo-600 flex items-center justify-center text-[10px] transition-colors"><i class="fa-solid fa-pen"></i></button>
            <button onclick="window.deleteSchedule('${item.id}')" class="w-7 h-7 rounded-xl bg-rose-50 text-rose-500 hover:bg-rose-100 flex items-center justify-center text-[10px] transition-colors"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(itemEl);
      });
    }

    window.changeCalendarMonth = (offset) => {
      calendarDate.setMonth(calendarDate.getMonth() + offset);
      renderCalendar();
    };

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      
      const titleEl = document.getElementById('calendar-month-title');
      if (titleEl) titleEl.innerText = `${year}. ${(month + 1).toString().padStart(2, '0')}`;

      const grid = document.getElementById('calendar-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-14 bg-slate-50/30 rounded-xl";
        grid.appendChild(emptyCell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;
        const isToday = (dateStr === todayStr);
        const isMovingDay = (dateStr === `${year}-10-07`);

        const dayItems = schedules.filter(s => s.date === dateStr);

        const cell = document.createElement('div');
        cell.className = `h-14 p-1 rounded-xl border flex flex-col justify-between overflow-hidden transition-all ${
          isMovingDay 
            ? 'bg-indigo-50 border-indigo-300 ring-1 ring-indigo-400' 
            : isToday 
              ? 'bg-rose-50/70 border-rose-200 ring-1 ring-rose-300' 
              : 'bg-white border-slate-100'
        }`;

        let topHtml = `<div class="flex items-center justify-between"><span class="text-[10px] font-bold px-1 rounded-full ${
          isToday ? 'bg-rose-500 text-white' : isMovingDay ? 'bg-indigo-600 text-white' : 'text-slate-700'
        }">${d}</span>`;

        if (isMovingDay) {
          topHtml += `<span class="text-[7px] bg-indigo-100 text-indigo-700 font-extrabold px-1 rounded">이사일</span>`;
        } else if (dayItems.length > 0) {
          topHtml += `<span class="text-[7px] bg-amber-100 text-amber-700 font-extrabold px-1 rounded">${dayItems.length}건</span>`;
        }
        topHtml += `</div>`;

        let itemsHtml = '<div class="space-y-0.5 overflow-y-auto custom-scrollbar flex-grow mt-0.5">';
        dayItems.forEach(item => {
          itemsHtml += `<div class="text-[7px] truncate px-1 rounded font-semibold bg-rose-50 text-rose-700" title="${item.title}">${item.title}</div>`;
        });
        itemsHtml += '</div>';

        cell.innerHTML = topHtml + itemsHtml;
        grid.appendChild(cell);
      }
    }

    window.openScheduleModal = (id = '') => {
      document.getElementById('edit-id').value = id;
      if (id) {
        document.getElementById('modal-title').innerText = '일정 및 요금 수정';
        const item = schedules.find(s => s.id === id);
        if (item) {
          document.getElementById('input-title').value = item.title || '';
          document.getElementById('input-date').value = item.date || '';
          document.getElementById('input-cost').value = item.cost || '';
        }
      } else {
        document.getElementById('modal-title').innerText = '이사 일정 및 요금 추가';
        document.getElementById('input-title').value = '';
        document.getElementById('input-date').value = '';
        document.getElementById('input-cost').value = '';
      }
      document.getElementById('schedule-modal').classList.remove('hidden');
    };

    window.closeScheduleModal = () => document.getElementById('schedule-modal').classList.add('hidden');

    window.editSchedule = (id) => window.openScheduleModal(id);

    window.saveSchedule = async () => {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('input-title').value.trim();
      const date = document.getElementById('input-date').value;
      const cost = document.getElementById('input-cost').value;

      if (!title) return;

      window.closeScheduleModal();

      try {
        if (id) {
          await updateDoc(doc(db, 'yondu_moving_schedules', id), { title, date, cost });
        } else {
          await addDoc(collection(db, 'yondu_moving_schedules'), { title, date, cost });
        }
      } catch (e) {
        console.error("Save error:", e);
      }
    };

    window.deleteSchedule = async (id) => {
      try {
        await deleteDoc(doc(db, 'yondu_moving_schedules', id));
      } catch (e) {
        console.error("Delete error:", e);
      }
    };
  </script>
</body>
</html>
