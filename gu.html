<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구읍뱃터 부부 술기행 1~4차 코스</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; margin: 0; padding: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    /* 구읍뱃터의 일몰과 로맨틱한 데이트를 연상시키는 그라데이션 */
    .hero-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #d946ef 50%, #f43f5e 100%);
    }
    .check-animation { transition: all 0.2s ease-in-out; }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen p-0 sm:p-6 bg-slate-100">

  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[920px] sm:rounded-[2.5rem] sm:shadow-2xl sm:border border-slate-200/80 relative flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="hero-gradient text-white pt-8 pb-6 px-6 relative flex-shrink-0 shadow-lg">
      <div class="absolute top-4 right-4 bg-white/25 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-extrabold tracking-wide text-white shadow-sm">
        👩‍❤️‍👨 부부 오붓하게
      </div>
      <div class="flex items-center gap-2 mb-2">
        <span class="bg-white/20 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-lg uppercase tracking-wider">
          🚶‍♂️ 전 코스 도보 5분 컷
        </span>
        <span class="text-pink-100 text-xs font-semibold">🍻 토요일 오후 2시 시작</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight">구읍뱃터 1~4차 술기행</h1>
      <p class="text-xs text-pink-100 mt-1">아내가 가고 싶은 곳만 쏙쏙 골라 만드는 맞춤 코스</p>
    </header>

    <!-- Info Banner -->
    <div class="px-5 -mt-3.5 relative z-20 flex-shrink-0">
      <div class="block bg-white rounded-2xl p-4 shadow-lg border border-slate-100 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-pink-50 text-pink-500 flex items-center justify-center font-bold text-lg shadow-inner">
          <i class="fa-solid fa-heart"></i>
        </div>
        <div>
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">사용 방법</p>
          <h3 class="text-xs font-extrabold text-slate-900 mt-0.5">마음에 드는 식당의 <span class="text-pink-500">♡ 버튼</span>을 눌러 일정을 완성하세요!</h3>
        </div>
      </div>
    </div>

    <div class="flex border-b border-slate-100 bg-slate-50/80 p-2 gap-2 mt-3 flex-shrink-0 mx-4 rounded-2xl">
      <button onclick="window.switchTab('all')" id="tab-all" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition-all bg-white shadow-sm text-pink-600 border border-slate-200/60">
        전체 코스 보기
      </button>
      <button onclick="window.switchTab('selected')" id="tab-selected" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-500 hover:bg-white/50 relative">
        우리의 일정 <span id="selected-count" class="bg-pink-500 text-white text-[9px] px-1.5 py-0.5 rounded-full ml-1 hidden">0</span>
      </button>
    </div>

    <section class="flex-grow flex flex-col p-5 gap-4 overflow-y-auto bg-slate-50/40 custom-scrollbar pb-12">
      <!-- 전체 코스 목록 영역 -->
      <div id="content-all" class="space-y-4">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">추천 맛집 리스트 (카테고리별)</h2>
          <span class="text-[11px] text-pink-500 font-bold">총 50곳의 엄선된 핫플</span>
        </div>
        
        <!-- 필터 버튼 추가 (4차 카페/디저트 추가) -->
        <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
          <button onclick="window.setFilter('all')" id="filter-all" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-800 text-white transition-colors">전체보기</button>
          <button onclick="window.setFilter('1차')" id="filter-1차" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white text-slate-500 border border-slate-200 transition-colors">1차 (식사/회/고기)</button>
          <button onclick="window.setFilter('2차')" id="filter-2차" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white text-slate-500 border border-slate-200 transition-colors">2차 (술/안주/맥주)</button>
          <button onclick="window.setFilter('3차')" id="filter-3차" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white text-slate-500 border border-slate-200 transition-colors">3차 (국물/해장)</button>
          <button onclick="window.setFilter('4차')" id="filter-4차" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white text-slate-500 border border-slate-200 transition-colors">쉬어가기 (카페)</button>
        </div>

        <div id="place-list-container" class="space-y-4 mt-2">
        <div id="selected-list-container" class="space-y-4 relative">
          <!-- JS로 선택된 카드가 렌더링 됩니다 -->
        </div>
        <!-- 공유하기 버튼 (가짜 기능이지만 UI 완성도를 위해) -->
        <button onclick="alert('남편에게 일정을 전송했습니다! (예시 기능)')" class="w-full mt-4 bg-slate-900 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg hover:bg-slate-800 transition-colors">
          남편에게 일정 공유하기 💌
        </button>
      </div>
    </section>
  </div>

  <script>
    const colorMap = {
      'blue': { bg: 'bg-blue-50', text: 'text-blue-600', lightText: 'text-blue-400', hexBg: 'eff6ff', hexText: '2563eb' },
      'rose': { bg: 'bg-rose-50', text: 'text-rose-600', lightText: 'text-rose-400', hexBg: 'fff1f2', hexText: 'e11d48' },
      'amber': { bg: 'bg-amber-50', text: 'text-amber-600', lightText: 'text-amber-400', hexBg: 'fffbeb', hexText: 'd97706' },
      'emerald': { bg: 'bg-emerald-50', text: 'text-emerald-600', lightText: 'text-emerald-400', hexBg: 'ecfdf5', hexText: '059669' },
      'purple': { bg: 'bg-purple-50', text: 'text-purple-600', lightText: 'text-purple-400', hexBg: 'f5f3ff', hexText: '7c3aed' }
    };

    // 50개의 구읍뱃터 및 영종도 핫플 데이터 (사진 URL 대신 색상별 플레이스홀더 사용)
    const places = [
      // 1차 추천 (식사/회/고기) - 15곳
      { id: 'p1', round: '1차', time: '식사/회', name: '구읍뱃터 어시장', desc: '1층에서 팔딱이는 회를 떠서 3층 초장집으로! 오션뷰와 함께 소주 한잔 시작하기 가장 좋은 구읍뱃터의 상징.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터어시장', colorClass: 'blue' },
      { id: 'p2', round: '1차', time: '꼬막/전', name: '바다앞꼬막집', desc: '고소한 꼬막무침과 비빔밥에 달달한 꿀동동주 찰떡궁합. 바다 보며 먹는 꿀맛 안주 맛집.', mapUrl: 'https://map.naver.com/p/search/바다앞꼬막집', colorClass: 'rose' },
      { id: 'p3', round: '1차', time: '조개구이', name: '낭만조개 본점', desc: '바다를 보며 굽는 조개구이. 고소한 치즈 가리비에 소주 한 잔 곁들이면 분위기 최고!', mapUrl: 'https://map.naver.com/p/search/영종도 낭만조개', colorClass: 'amber' },
      { id: 'p4', round: '1차', time: '양식/와인', name: '바다앞테이블', desc: '분위기 내고 싶을 때! 파스타나 스테이크에 와인이나 생맥주 한 잔 곁들이기 좋은 예쁜 레스토랑.', mapUrl: 'https://map.naver.com/p/search/바다앞테이블', colorClass: 'emerald' },
      { id: 'p5', round: '1차', time: '해물한상', name: '은하수', desc: '고급스럽고 정갈한 해산물 한상차림. 조용하고 오붓하게 데이트 1차로 완벽한 곳.', mapUrl: 'https://map.naver.com/p/search/영종도 은하수', colorClass: 'blue' },
      { id: 'p6', round: '1차', time: '중식/짬뽕', name: '달토끼짬뽕', desc: '얼큰한 짬뽕 국물에 바삭한 탕수육. 은근히 소주 안주로 기가 막힌 중식 베이스 1차.', mapUrl: 'https://map.naver.com/p/search/영종도 달토끼짬뽕', colorClass: 'rose' },
      { id: 'p7', round: '1차', time: '해물찜', name: '진로식당', desc: '매콤하고 푸짐한 해물찜에 소주 한잔. 로컬들이 자주 찾는 든든한 1차 식당.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 진로식당', colorClass: 'rose' },
      { id: 'p8', round: '1차', time: '돼지고기', name: '영종도 갈매기', desc: '쫄깃한 갈매기살 숯불구이! 해산물보다 고기가 땡길 때 1차로 가기 좋은 고기 맛집.', mapUrl: 'https://map.naver.com/p/search/영종도 갈매기', colorClass: 'amber' },
      { id: 'p9', round: '1차', time: '생선구이', name: '바다향기', desc: '짭조름하고 바삭하게 구워낸 생선구이 모듬. 밥도둑이자 훌륭한 반주 안주.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 바다향기', colorClass: 'blue' },
      { id: 'p10', round: '1차', time: '전복/해물', name: '연화리가는길', desc: '기장 연화리 스타일의 싱싱한 해산물 모듬과 고소한 전복죽 한 솥.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 연화리가는길', colorClass: 'emerald' },
      { id: 'p11', round: '1차', time: '조개구이', name: '영종도 조개타운', desc: '무한리필로 즐길 수 있는 가성비 좋은 조개구이집. 치즈 듬뿍 올려 굽는 재미.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 조개타운', colorClass: 'amber' },
      { id: 'p12', round: '1차', time: '삼겹살', name: '솥뚜껑 삼겹살', desc: '거대한 솥뚜껑 위에 김치와 콩나물을 올려 함께 구워 먹는 기름진 삼겹살.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 솥뚜껑삼겹살', colorClass: 'rose' },
      { id: 'p13', round: '1차', time: '해산물', name: '황금물고기', desc: '회와 랍스터 코스요리를 즐길 수 있는 곳. 기념일이나 특별한 데이트에 추천.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 황금물고기', colorClass: 'purple' },
      { id: 'p14', round: '1차', time: '파전/막걸리', name: '해물칼국수와 파전', desc: '바삭하고 두툼한 해물파전에 막걸리 한잔으로 시작하는 정겨운 1차.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 파전', colorClass: 'amber' },
      { id: 'p15', round: '1차', time: '물회/덮밥', name: '어부의집', desc: '새콤달콤 살얼음 동동 띄운 시원한 물회. 더운 날씨에 첫 술안주로 완벽.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 어부의집', colorClass: 'blue' },
      
      // 2차 추천 (술/맥주/이자카야) - 15곳
      { id: 'p16', round: '2차', time: '이색튀김', name: '천돈', desc: '겉바속촉 이색 안주 돼지후라이드! 해산물 먹은 후 기름진 안주에 맥주로 입가심.', mapUrl: 'https://map.naver.com/p/search/영종도 천돈', colorClass: 'amber' },
      { id: 'p17', round: '2차', time: '얼음맥주', name: '인쌩맥주 구읍뱃터점', desc: '머리까지 시원해지는 살얼음 맥주와 가성비 넘치는 다양한 안주들이 가득한 곳.', mapUrl: 'https://map.naver.com/p/search/인쌩맥주 구읍뱃터', colorClass: 'blue' },
      { id: 'p18', round: '2차', time: '생맥/호프', name: '크라운호프', desc: '2차로 가볍게 건어물이나 치킨에 시원한 생맥주 마시기 좋은 정통 호프집.', mapUrl: 'https://map.naver.com/p/search/크라운호프 구읍뱃터', colorClass: 'emerald' },
      { id: 'p19', round: '2차', time: '이자카야', name: '쿠마', desc: '따뜻한 사케나 하이볼에 야키토리(꼬치구이)를 조용히 즐길 수 있는 선술집.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 쿠마', colorClass: 'rose' },
      { id: 'p20', round: '2차', time: '마른안주', name: '무지개맥주', desc: '드라이아이스 냉각수로 눈이 즐거운 숙성 맥주와 배부르지 않은 마른안주.', mapUrl: 'https://map.naver.com/p/search/무지개맥주 구읍뱃터', colorClass: 'purple' },
      { id: 'p21', round: '2차', time: '야외펍', name: '오션솔레뷰 테라스', desc: '선선한 바닷바람 맞으며 야외 테라스에서 즐기는 노상 느낌의 맥주 한잔.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 오션솔레뷰', colorClass: 'blue' },
      { id: 'p22', round: '2차', time: '건어물', name: '역전할머니맥주', desc: '오징어입, 먹태 등 배부르지 않은 가성비 최고의 2차 안주 성지.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 역전할머니맥주', colorClass: 'amber' },
      { id: 'p23', round: '2차', time: '치킨/맥주', name: '펀비어킹', desc: '반반 치킨부터 피자까지 안주 천국. 넓고 쾌적해서 술 마시기 좋은 호프.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 펀비어킹', colorClass: 'rose' },
      { id: 'p24', round: '2차', time: '오뎅바', name: '영종도 오뎅바', desc: '모락모락 김이 나는 다찌석에서 어묵 꼬치와 정종 한잔 즐기는 로맨틱한 2차.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 오뎅바', colorClass: 'blue' },
      { id: 'p25', round: '2차', time: '포장마차', name: '밤바다 포차', desc: '매콤한 오돌뼈, 닭똥집 등 실내 포장마차 감성을 제대로 느낄 수 있는 곳.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 포장마차', colorClass: 'emerald' },
      { id: 'p26', round: '2차', time: '바(Bar)', name: '달빛 칵테일', desc: '가끔은 소주 대신 달콤한 칵테일로 분위기를 전환하고 싶을 때 좋은 조용한 바.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 칵테일', colorClass: 'purple' },
      { id: 'p27', round: '2차', time: '수제맥주', name: '구읍뱃터 브루어리', desc: '다양한 향과 맛의 크래프트 비어를 맛볼 수 있는 맥주 덕후들을 위한 펍.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 수제맥주', colorClass: 'amber' },
      { id: 'p28', round: '2차', time: '철판요리', name: '철판요리주점', desc: '오코노미야끼나 야끼소바 등 눈앞에서 볶아주는 철판 안주와 하이볼.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 철판요리', colorClass: 'rose' },
      { id: 'p29', round: '2차', time: '야키토리', name: '꼬치구이 전문점', desc: '숯불 향 가득 배인 다양한 닭꼬치류를 낱개로 시켜 가볍게 술 마시기 좋은 곳.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 꼬치', colorClass: 'amber' },
      { id: 'p30', round: '2차', time: '퓨전주점', name: '퓨전포차', desc: '크림 짬뽕, 치즈 감자전 등 트렌디하고 맛있는 안주가 있는 감성 주점.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 감성주점', colorClass: 'blue' },

      // 3차 추천 (국물/해장) - 10곳
      { id: 'p31', round: '3차', time: '조개전골', name: '97도씨해물칼국수', desc: '조개 듬뿍 시원한 국물로 해장과 동시에 소주 한잔 더! 땡초부추전도 필수.', mapUrl: 'https://map.naver.com/p/search/97도씨해물칼국수', colorClass: 'blue' },
      { id: 'p32', round: '3차', time: '칼국수', name: '고래해물칼국수', desc: '깔끔하고 깊은 국물의 해물칼국수와 바삭한 해물파전으로 마지막 소주 털어넣기.', mapUrl: 'https://map.naver.com/p/search/영종도 고래해물칼국수', colorClass: 'emerald' },
      { id: 'p33', round: '3차', time: '해물라면', name: '바다앞라면집', desc: '통문어와 게가 통째로 들어간 얼큰한 해물라면! 칼칼한 국물로 속풀이 완벽.', mapUrl: 'https://map.naver.com/p/search/바다앞라면집', colorClass: 'rose' },
      { id: 'p34', round: '3차', time: '감자탕', name: '뼈해장국집', desc: '얼큰하고 든든한 뼈해장국 국물. 한국인이라면 거부할 수 없는 최고의 해장 3차.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 감자탕', colorClass: 'amber' },
      { id: 'p35', round: '3차', time: '얼큰짬뽕', name: '짬뽕지존', desc: '불맛 강한 맵고 얼큰한 짬뽕으로 술기운을 확 날려버리는 국물 코스.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 짬뽕', colorClass: 'rose' },
      { id: 'p36', round: '3차', time: '우동/소바', name: '구읍뱃터 우동집', desc: '가볍고 깔끔한 가쓰오부시 우동 국물로 위장을 편안하게 달래주는 심야 우동.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 우동', colorClass: 'blue' },
      { id: 'p37', round: '3차', time: '국밥', name: '수육국밥', desc: '진한 사골 국물에 수육 듬뿍. 밥을 말아 든든하게 속을 채우는 3차.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 국밥', colorClass: 'emerald' },
      { id: 'p38', round: '3차', time: '해장국', name: '선지해장국', desc: '철분 가득 얼큰한 선지해장국. 다음 날 숙취를 방지하는 최고의 선택.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 해장국', colorClass: 'purple' },
      { id: 'p39', round: '3차', time: '분식/오뎅', name: '길거리 포장마차', desc: '가게에서 나와 길거리에서 가볍게 오뎅국물과 떡볶이로 서서 막잔하며 데이트 마무리.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 떡볶이', colorClass: 'amber' },
      { id: 'p40', round: '3차', time: '야외라면', name: '편의점 야외테이블', desc: '바닷바람 맞으며 편의점 캔맥주와 컵라면으로 소박하고 낭만적으로 끝내는 3차.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 편의점', colorClass: 'blue' },

      // 4차 추천 (쉬어가기 - 카페/디저트) - 10곳
      { id: 'p41', round: '4차', time: '베이커리', name: '바다앞테라스', desc: '술 마시다 잠시 깰 겸 들리기 좋은 대형 루프탑 카페. 달달한 빵으로 당 충전.', mapUrl: 'https://map.naver.com/p/search/바다앞테라스', colorClass: 'purple' },
      { id: 'p42', round: '4차', time: '카페/뷰', name: '평상인', desc: '통창 너머로 바다를 보며 쉴 수 있는 대형 카페. 폭신한 소파에서 잠시 휴식.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 평상인', colorClass: 'emerald' },
      { id: 'p43', round: '4차', time: '전통차', name: '차덕분', desc: '커피 대신 따뜻한 차와 정갈한 한국식 디저트로 차분하게 술을 깨는 힐링 타임.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 차덕분', colorClass: 'amber' },
      { id: 'p44', round: '4차', time: '포토존', name: '랑데자뷰', desc: '제주도 감성의 인테리어. 술기운에 아내와 예쁜 거울 셀카 남기기 좋은 카페.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 랑데자뷰', colorClass: 'rose' },
      { id: 'p45', round: '4차', time: '소금빵', name: '빵얼굴', desc: '버터 풍미 가득한 소금빵 맛집. 가벼운 탄수화물로 안주 배를 리셋하기.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 빵얼굴', colorClass: 'blue' },
      { id: 'p46', round: '4차', time: '아이스크림', name: '구읍뱃터 젤라또', desc: '술 먹고 나면 무조건 땡기는 시원하고 달콤한 젤라또 아이스크림!', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 젤라또', colorClass: 'purple' },
      { id: 'p47', round: '4차', time: '과일디저트', name: '바다앞농장', desc: '상큼한 생과일이 듬뿍 올라간 디저트로 술 냄새를 싹 지워주는 상큼한 곳.', mapUrl: 'https://map.naver.com/p/search/바다앞농장', colorClass: 'emerald' },
      { id: 'p48', round: '4차', time: '미니멀', name: '바다앞미니멀', desc: '조용하고 아늑한 공간에서 도란도란 둘만의 깊은 대화를 나누기 좋은 작은 카페.', mapUrl: 'https://map.naver.com/p/search/바다앞미니멀', colorClass: 'rose' },
      { id: 'p49', round: '4차', time: '프랜차이즈', name: '오션뷰 프랜차이즈', desc: '아메리카노 수혈이 시급할 때! 바다가 보이는 쾌적하고 익숙한 대형 커피숍.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 카페', colorClass: 'blue' },
      { id: 'p50', round: '4차', time: '간식거리', name: '해변가 츄러스', desc: '길거리에서 갓 튀긴 바삭한 츄러스 하나씩 들고 해변 산책하며 술 깨기.', mapUrl: 'https://map.naver.com/p/search/구읍뱃터 간식', colorClass: 'amber' }
    ];

    let selectedIds = [];
    let currentFilter = 'all';

    window.toggleSelection = (id) => {
      const index = selectedIds.indexOf(id);
      if (index > -1) {
        selectedIds.splice(index, 1); 
      } else {
        selectedIds.push(id); 
      }
      
      // 순서대로 정렬 (id 순 정렬)
      selectedIds.sort((a, b) => {
        const numA = parseInt(a.replace('p', ''));
        const numB = parseInt(b.replace('p', ''));
        return numA - numB;
      });
      
      updateUI();
    };

    window.setFilter = (cat) => {
      currentFilter = cat;
      
      const filters = ['all', '1차', '2차', '3차', '4차'];
      filters.forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if(f === cat) {
          btn.className = "flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-slate-800 text-white transition-colors";
        } else {
          btn.className = "flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold bg-white text-slate-500 border border-slate-200 transition-colors";
        }
      });
      
      updateUI();
    };

    const createCardHTML = (place, isSelected, showOrder = false, orderIndex = 0) => {
      const colors = colorMap[place.colorClass] || colorMap['blue'];
      const btnClass = isSelected 
        ? 'bg-pink-500 text-white border-pink-500 shadow-md' 
        : 'bg-white text-slate-300 border-slate-200 hover:border-pink-300 hover:text-pink-300';
      const iconClass = isSelected ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
      
      const orderBadge = showOrder 
        ? `<div class="absolute -left-2 -top-2 bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold z-20 border-2 border-white shadow-sm">${orderIndex}</div>`
        : '';

      // 대표 메뉴 사진 생성 (해당 카테고리 컬러를 활용한 플레이스홀더)
      const fallbackImg = `https://placehold.co/200x200/${colors.hexBg}/${colors.hexText}?text=${encodeURIComponent(place.time)}`;
      // 네이버 리뷰/블로그 검색 링크 자동 생성
      const searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent('영종도 구읍뱃터 ' + place.name)}`;

      return `
        <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm flex flex-col gap-3 relative transition-all duration-300 ${isSelected && !showOrder ? 'border-pink-300 bg-pink-50/20' : ''}">
          ${orderBadge}
          
          <!-- 상단: 사진 및 정보 영역 -->
          <div class="flex gap-3 relative">
             <!-- 사진 -->
             <div class="w-[88px] h-[88px] rounded-xl overflow-hidden flex-shrink-0 bg-slate-50 border border-slate-100 shadow-inner">
                <img src="${fallbackImg}" alt="${place.name}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" onerror="this.src='${fallbackImg}'"/>
             </div>
             
             <!-- 텍스트 정보 -->
             <div class="flex-grow flex flex-col justify-center py-0.5">
                <div class="flex items-start justify-between pr-8">
                  <div>
                    <span class="text-[9px] px-1.5 py-0.5 rounded-md ${colors.bg} ${colors.text} font-bold mb-1.5 inline-block border border-white/50">${place.round} · ${place.time}</span>
                    <h3 class="text-[14px] font-extrabold text-slate-900 leading-tight tracking-tight">${place.name}</h3>
                  </div>
                </div>
                
                <!-- 액션 버튼 (지도/리뷰) -->
                <div class="flex gap-1.5 mt-2.5">
                  <a href="${place.mapUrl}" target="_blank" class="flex-1 text-[10px] text-white font-bold bg-slate-800 py-1.5 rounded-lg shadow-sm hover:bg-slate-700 flex items-center justify-center gap-1 transition-colors"><i class="fa-solid fa-map-location-dot"></i> 지도</a>
                  <a href="${searchUrl}" target="_blank" class="flex-1 text-[10px] text-slate-600 font-bold bg-white border border-slate-200 py-1.5 rounded-lg shadow-sm hover:bg-slate-50 flex items-center justify-center gap-1 transition-colors"><i class="fa-solid fa-magnifying-glass"></i> 리뷰</a>
                </div>
             </div>

             <!-- 찜하기 버튼 (우측 상단 절대 배치) -->
             ${!showOrder ? `
                <button onclick="window.toggleSelection('${place.id}')" class="absolute -top-1.5 -right-1.5 flex-shrink-0 w-9 h-9 rounded-full border-2 flex items-center justify-center check-animation ${btnClass} z-10 bg-white">
                  <i class="${iconClass} text-sm"></i>
                </button>
              ` : ''}
          </div>

          <!-- 하단: 설명 영역 -->
          <div class="bg-slate-50/60 p-2.5 rounded-xl border border-slate-100/80">
             <p class="text-[11px] text-slate-600 leading-relaxed break-keep">${place.desc}</p>
          </div>
        </div>
      `;
    };

    const updateUI = () => {
      const listContainer = document.getElementById('place-list-container');
      const selectedContainer = document.getElementById('selected-list-container');
      const countBadge = document.getElementById('selected-count');
      
      const filteredPlaces = currentFilter === 'all' 
        ? places 
        : places.filter(p => p.round === currentFilter);
        
      listContainer.innerHTML = filteredPlaces.map(place => 
        createCardHTML(place, selectedIds.includes(place.id))
      ).join('');

      if (selectedIds.length === 0) {
        selectedContainer.innerHTML = `
          <div class="py-12 flex flex-col items-center justify-center text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 text-2xl mb-3">
              <i class="fa-solid fa-face-sad-tear"></i>
            </div>
            <p class="text-xs text-slate-500 font-bold">아직 선택된 일정이 없어요.</p>
            <p class="text-[10px] text-slate-400 mt-1">'전체 코스 보기'에서 ♡를 눌러 추가해보세요!</p>
          </div>
        `;
      } else {
        const selectedPlaces = places.filter(p => selectedIds.includes(p.id));
        selectedContainer.innerHTML = `
          <div class="absolute left-[39px] top-4 bottom-4 w-0.5 bg-slate-200 z-0 hidden sm:block"></div>
          ${selectedPlaces.map((place, idx) => createCardHTML(place, true, true, idx + 1)).join('')}
        `;
      }

      if (selectedIds.length > 0) {
        countBadge.textContent = selectedIds.length;
        countBadge.classList.remove('hidden');
      } else {
        countBadge.classList.add('hidden');
      }
    };

    window.switchTab = (tab) => {
      const tabAll = document.getElementById('tab-all');
      const tabSelected = document.getElementById('tab-selected');
      const contentAll = document.getElementById('content-all');
      const contentSelected = document.getElementById('content-selected');

      if (tab === 'all') {
        tabAll.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition-all bg-white shadow-sm text-pink-600 border border-slate-200/60";
        tabSelected.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-500 hover:bg-white/50 relative";
        contentAll.classList.remove('hidden');
        contentSelected.classList.add('hidden');
      } else {
        tabSelected.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition-all bg-white shadow-sm text-pink-600 border border-slate-200/60 relative";
        tabAll.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-500 hover:bg-white/50";
        contentSelected.classList.remove('hidden');
        contentAll.classList.add('hidden');
      }
    };

    // 초기화
    updateUI();
  </script>
</body>
</html>
