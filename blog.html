<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초코땡!!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-6 md:p-10 font-sans text-slate-800">
    
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- 헤더 -->
        <header class="text-center space-y-3 mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 flex items-center justify-center gap-3">
                <span>🥰👍</span>초코땡!!
            </h1>
            <p class="text-slate-500 text-lg">
                사진과 미션을 업로드하면, 내 말투를 똑같이 따라하는 완벽한 체험단 리뷰를 완성해줍니다.
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- 왼쪽 패널: 입력 폼 -->
            <div class="space-y-6">
                
                <!-- 1. 설정 카드 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2 mb-4 text-lg font-bold text-slate-800">
                        <i class="ph-fill ph-gear text-blue-500 text-xl"></i>
                        <h2>기본 설정</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">
                                Gemini API Key
                            </label>
                            <input 
                                type="password" 
                                id="apiKeyInput"
                                value="AQ.Ab8RN6KJxre4I95CqyUmvdLvLFLk4qE3C-7fuinGU-vWRnWbVA"
                                placeholder="API 키를 입력하세요"
                                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                            />
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">
                                내 말투 / 스타일 레퍼런스 (선택)
                            </label>
                            <textarea 
                                id="styleRefInput"
                                placeholder="예: 안녕하세요! 오늘은 찐 맛집을 다녀왔어요 😋 블로그 톤으로 친근하게 씁니다."
                                class="w-full px-4 py-3 border border-slate-300 rounded-lg h-64 resize-y focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition-all leading-relaxed"
                            >[Tone & Style Rules]
1. 말투: 부드럽고 다정한 존댓말 과거형 해요체(~했어요, ~있었어요, ~들었어요, ~되었어요, ~더라고요)를 80% 이상 사용해.
2. 문장 기호: 문장 끝이나 중간에 물결표(~)를 자연스럽게 사용해 (예: 넓고 쾌적했어요~, 주문도 간편했어요~).
3. 이모지 활용: 각 단락 끝이나 소제목에 적절한 이모지(👍, 💕, 🙂, 😀, 😌, 😉, 🥹, 😋, 🥩, ☕)를 1~2개씩 곁들여줘.
4. 호흡: 스마트폰 읽기에 최적화되도록 1~2문장마다 자주 줄바꿈을 해줘.

[Structure & Template]
- [제목]: [지역/지하철역 키워드] [상호명], [핵심 특징/메뉴] [후기/방문기]
- [도입부]: 누구와 방문했는지(신랑, 아이 등), 매장의 위치/접근성 설명으로 시작.
- [본문 소제목]: 이모지를 포함한 소제목으로 구분 (예: 🏠 매장 분위기, 📋 주문 및 시스템, 🍽️ 기본 상차림, 🔥 메인 메뉴 맛 후기).
- [본문 내용]: 매장 분위기 -> 주문 및 메뉴 -> 기본찬/서비스 -> 메인 메뉴 비주얼 및 맛(소스/조합 강조) 순서로 묘사.
- [총평]: 반드시 '✅ 총평' 소제목을 넣고 핵심 정리 및 추천 대상 언급.
- [마무리]: 시그니처 문구 "재방문 의사 100%입니다👍" (또는 200%) 로 끝맺고 마지막에 주소 표기.</textarea>
                        </div>
                    </div>
                </div>

                <!-- 2. 미션 업로드 카드 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2 mb-2 text-lg font-bold text-slate-800">
                        <i class="ph-fill ph-file-text text-purple-500 text-xl"></i>
                        <h2>체험단 미션 가이드라인 (선택)</h2>
                    </div>
                    <p class="text-sm text-slate-500 mb-4">
                        글자 수 제한, 필수 키워드가 적힌 미션 이미지를 올리면 AI가 알아서 지켜줍니다.
                    </p>
                    
                    <div 
                        class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer group"
                        onclick="document.getElementById('missionInput').click()"
                    >
                        <input type="file" id="missionInput" multiple accept="image/*" class="hidden" />
                        <i class="ph ph-upload-simple text-3xl mx-auto text-slate-400 mb-2 group-hover:text-purple-500 transition-colors block"></i>
                        <p class="text-sm font-medium text-slate-700">클릭하여 미션 캡처 업로드</p>
                        <p class="text-xs text-slate-400 mt-1">(최대 3장)</p>
                    </div>
                    <div id="missionPreview" class="flex flex-wrap gap-3 mt-4 hidden"></div>
                </div>

                <!-- 3. 리뷰 사진 업로드 카드 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex flex-col mb-4">
                        <div class="flex items-center gap-2 text-lg font-bold text-slate-800">
                            <i class="ph-fill ph-image text-emerald-500 text-xl"></i>
                            <h2>포스팅할 사진 (필수)</h2>
                        </div>
                        <p class="text-sm text-slate-500 mt-1">
                            리뷰할 제품이나 공간의 사진을 올려주세요. (최대 10장)
                        </p>
                    </div>
                    
                    <div 
                        class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer group"
                        onclick="document.getElementById('mediaInput').click()"
                    >
                        <input type="file" id="mediaInput" multiple accept="image/*" class="hidden" />
                        <i class="ph ph-image text-3xl mx-auto text-slate-400 mb-2 group-hover:text-emerald-500 transition-colors block"></i>
                        <p class="text-sm font-medium text-slate-700">클릭하여 리뷰 사진 업로드</p>
                    </div>
                    <div id="mediaPreview" class="flex flex-wrap gap-3 mt-4 hidden"></div>
                </div>

                <!-- 생성 버튼 -->
                <button
                    id="generateBtn"
                    class="w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 transition-all transform active:scale-[0.98] bg-slate-300 text-slate-500 cursor-not-allowed"
                    disabled
                >
                    <i id="loadingIcon" class="ph ph-spinner text-2xl spinner hidden"></i>
                    <span id="btnText">🚀 완벽한 블로그 포스팅 생성하기</span>
                </button>
                
                <!-- 에러 메시지 팝업 -->
                <div id="errorBox" class="hidden flex items-center gap-3 text-red-600 bg-red-50 p-4 rounded-xl border border-red-200">
                    <i class="ph-fill ph-warning-circle text-xl flex-shrink-0"></i>
                    <p id="errorText" class="text-sm font-semibold"></p>
                </div>
            </div>

            <!-- 오른쪽 패널: 결과 출력 영역 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[800px] lg:h-auto">
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-100">
                    <div class="flex items-center gap-2 text-lg font-bold text-slate-800">
                        <i class="ph-fill ph-check-circle text-blue-500 text-xl"></i>
                        <h2>생성된 포스팅 결과</h2>
                    </div>
                    
                    <button 
                        id="copyBtn"
                        class="flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all bg-slate-50 text-slate-400 cursor-not-allowed border border-slate-200"
                        disabled
                    >
                        <i class="ph ph-copy"></i> 전체 복사
                    </button>
                </div>

                <div class="flex-1 bg-slate-50 rounded-xl border border-slate-200 overflow-hidden relative shadow-inner">
                    <textarea
                        id="resultTextarea"
                        readonly
                        class="hidden w-full h-full p-6 bg-transparent resize-none focus:outline-none text-slate-800 leading-relaxed whitespace-pre-wrap text-base font-medium"
                    ></textarea>
                    
                    <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-8 text-center bg-slate-50">
                        <i class="ph ph-file-text text-6xl mb-4 text-slate-300"></i>
                        <p class="text-slate-500 font-semibold text-lg mb-2">포스팅 결과가 여기에 표시됩니다.</p>
                        <p class="text-sm text-slate-400">
                            왼쪽 패널에서 사진을 업로드한 후<br/>'생성하기' 버튼을 눌러주세요.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 팝업 -->
    <div id="toast" class="hidden fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl font-semibold text-sm flex items-center gap-2 z-50 toast-enter">
        <i class="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
        <span id="toastText"></span>
    </div>

    <script>
        // State
        let missionFiles = [];
        let mediaFiles = [];
        let generatedResult = "";
        let isGenerating = false;

        // DOM Elements
        const missionInput = document.getElementById('missionInput');
        const mediaInput = document.getElementById('mediaInput');
        const missionPreview = document.getElementById('missionPreview');
        const mediaPreview = document.getElementById('mediaPreview');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const styleRefInput = document.getElementById('styleRefInput');
        const resultTextarea = document.getElementById('resultTextarea');
        const emptyState = document.getElementById('emptyState');
        const copyBtn = document.getElementById('copyBtn');

        function showToast(msg) {
            toastText.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.classList.remove('hidden');
            setTimeout(() => {
                errorBox.classList.add('hidden');
            }, 7000);
        }

        function updateGenerateButton() {
            if (isGenerating || mediaFiles.length === 0) {
                generateBtn.disabled = true;
                generateBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 transition-all transform bg-slate-300 text-slate-500 cursor-not-allowed";
            } else {
                generateBtn.disabled = false;
                generateBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 transition-all transform active:scale-[0.98] bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-200 hover:shadow-xl";
            }
        }

        function renderPreviews(filesArray, container, type) {
            container.innerHTML = '';
            if (filesArray.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            
            filesArray.forEach((file, index) => {
                const url = URL.createObjectURL(file);
                const div = document.createElement('div');
                div.className = "relative group " + (type === 'mission' ? 'w-16 h-16' : 'w-20 h-20');
                
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover rounded-lg border border-slate-200 shadow-sm" />
                    <button type="button" onclick="removeFile('${type}', ${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 opacity-0 group-hover:opacity-100 transition-all shadow-md hover:bg-red-600 hover:scale-110">
                        <i class="ph ph-trash text-xs"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        window.removeFile = function(type, index) {
            if (type === 'mission') {
                missionFiles.splice(index, 1);
                renderPreviews(missionFiles, missionPreview, 'mission');
            } else {
                mediaFiles.splice(index, 1);
                renderPreviews(mediaFiles, mediaPreview, 'media');
            }
            updateGenerateButton();
        };

        function handleFileSelect(e, filesArray, maxCount, container, type) {
            const selectedFiles = Array.from(e.target.files);
            const validFiles = selectedFiles.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
            
            if (filesArray.length + validFiles.length > maxCount) {
                showError(`최대 ${maxCount}장까지만 업로드 가능합니다.`);
                const allowed = maxCount - filesArray.length;
                filesArray.push(...validFiles.slice(0, allowed));
            } else {
                filesArray.push(...validFiles);
            }
            
            e.target.value = ''; // reset
            renderPreviews(filesArray, container, type);
            updateGenerateButton();
        }

        missionInput.addEventListener('change', (e) => handleFileSelect(e, missionFiles, 3, missionPreview, 'mission'));
        mediaInput.addEventListener('change', (e) => handleFileSelect(e, mediaFiles, 10, mediaPreview, 'media'));

        const fileToGenerativePart = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result.split(',')[1];
                    resolve({
                        inlineData: {
                            data: base64Data,
                            mimeType: file.type
                        }
                    });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showError('Gemini API Key를 입력해주세요.');
                return;
            }

            isGenerating = true;
            updateGenerateButton();
            loadingIcon.classList.remove('hidden');
            errorBox.classList.add('hidden');
            
            try {
                // 1. 공통 호출 함수 (보내주신 로직 반영)
                const MODEL = "gemini-2.5-flash";
                
                async function callGemini(parts, systemInstruction = null) {
                    const body = {
                        contents: [{ role: "user", parts }],
                        generationConfig: { temperature: 0.9, maxOutputTokens: 8192 }
                    };
                    
                    if (systemInstruction) {
                        body.systemInstruction = { parts: [{ text: systemInstruction }] };
                    }

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json", 
                            "x-goog-api-key": apiKey 
                        },
                        body: JSON.stringify(body)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        let message = errText;
                        try {
                            message = JSON.parse(errText)?.error?.message ?? errText;
                        } catch (e) {}
                        throw new Error(`API 요청 실패 [${res.status}]: ${message}`);
                    }

                    const json = await res.json();
                    const text = (json.candidates?.[0]?.content?.parts ?? [])
                        .map(p => p.text ?? "")
                        .join("");
                        
                    if (!text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
                    return text;
                }

                btnText.textContent = '이미지 파일 변환 중...';
                const missionParts = await Promise.all(missionFiles.map(fileToGenerativePart));
                const mediaParts = await Promise.all(mediaFiles.map(fileToGenerativePart));

                // 2. 미션 분석 (OCR)
                let constraints = "특이사항 없음";
                if (missionParts.length > 0) {
                    btnText.textContent = '미션 가이드라인 분석 중... (1/3)';
                    constraints = await callGemini([
                        { text: "다음 이미지는 블로그 체험단 미션 가이드라인 캡처입니다. 이미지 속 글자를 모두 읽고(OCR) 필수 키워드, 최소 글자 수, 최소 사진 개수, 필수 포함 문구, 금지 사항, 해시태그 등 제약 조건을 빠짐없이 항목별로 정리해 주세요." },
                        ...missionParts
                    ]);
                }

                // 3. 미디어 특징 추출
                btnText.textContent = '사진 및 동영상 분석 중... (2/3)';
                const mediaSummary = await callGemini([
                    { text: "다음은 블로그 후기에 사용할 제품/공간의 사진과 동영상입니다. 각 파일에서 보이는 외관, 색감, 재질, 분위기, 눈에 띄는 특징과 장점을 구체적으로 관찰해 목록으로 정리해 주세요. 추측성 정보는 배제하고 실제로 보이는 내용만 적어주세요." },
                    ...mediaParts
                ]);

                // 4. 최종 블로그 본문 작성
                btnText.textContent = '최종 블로그 포스팅 작성 중... (3/3)';
                const tone = styleRefInput.value.trim();
                const system = [
                    "당신은 한국 블로그 체험단 후기를 대신 써주는 전문 작가입니다.",
                    "항상 긍정적이고 생생한 어조로, 실제 방문/사용한 사람처럼 자연스럽게 작성합니다.",
                    tone ? `아래는 사용자가 평소 쓰는 말투 레퍼런스입니다. 어미, 이모지 사용 빈도, 문장 길이, 단락 리듬을 그대로 흉내 내세요.\n---\n${tone}\n---` : "특별한 말투 레퍼런스가 없으므로 친근한 존댓말 블로그 톤으로 작성하세요."
                ].join("\n\n");

                const prompt = `[반드시 지켜야 할 미션 제약 조건]\n${constraints}\n\n[업로드된 사진/동영상에서 확인된 시각적 특징]\n${mediaSummary}\n\n위 내용을 모두 반영해 완성된 블로그 후기 본문을 작성해 주세요.\n- 미션의 글자 수/키워드/해시태그 조건을 반드시 충족할 것\n- 업로드된 사진 개수(${mediaParts.length}장)에 맞춰 [사진 1] 같은 사진 삽입 위치 표시를 본문 중간중간 넣을 것\n- 소제목을 활용해 읽기 좋게 구성하고, 마지막에 해시태그를 정리할 것\n- 설명이나 주석 없이 블로그 본문만 출력할 것`;

                const finalText = await callGemini([{ text: prompt }], system);

                // 5. 결과 출력
                generatedResult = finalText;
                resultTextarea.value = finalText;
                emptyState.classList.add('hidden');
                resultTextarea.classList.remove('hidden');
                
                // 버튼 활성화
                copyBtn.disabled = false;
                copyBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all bg-blue-50 hover:bg-blue-100 text-blue-700 active:bg-blue-200 border border-blue-200 shadow-sm";
                
                showToast('포스팅이 성공적으로 생성되었습니다!');
                
            } catch (err) {
                console.error(err);
                showError(err.message || '오류가 발생했습니다.');
            } finally {
                isGenerating = false;
                loadingIcon.classList.add('hidden');
                btnText.textContent = '🚀 완벽한 블로그 포스팅 생성하기';
                updateGenerateButton();
            }
        });

        copyBtn.addEventListener('click', () => {
            if (generatedResult) {
                navigator.clipboard.writeText(generatedResult)
                    .then(() => showToast('클립보드에 전체 복사되었습니다! 블로그에 바로 붙여넣기 하세요.'))
                    .catch(() => showError('복사에 실패했습니다. 브라우저 권한을 확인해주세요.'));
            }
        });

    </script>
</body>
</html>
